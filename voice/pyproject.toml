[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeos-voice"
version = "0.1.0"
description = "homeOS voice service: wake word, speech to text and spoken replies for the wall display"
readme = "README.md"
requires-python = ">=3.11"
# The core (server, protocol, simulate mode) needs only websockets. Audio and
# models are optional extras, imported lazily, so tests run anywhere.
dependencies = ["websockets>=13"]

[project.optional-dependencies]
# Microphone capture, playback and voice activity detection.
# webrtcvad-wheels ships prebuilt wheels of webrtcvad (same `webrtcvad` module).
audio = ["sounddevice>=0.4.6", "numpy>=1.24", "webrtcvad-wheels>=2.0.11"]
stt = ["faster-whisper>=1.0", "numpy>=1.24"]
tts = ["piper-tts>=1.3"]
# openwakeword requires tflite-runtime on Linux, which has no wheels for Python
# 3.12+ (Raspberry Pi OS Trixie has 3.13), so asking for it there makes the
# whole install fail. We run its ONNX models, so on those Pythons this extra
# brings what openwakeword needs and openwakeword itself is installed with
# `pip install --no-deps 'openwakeword>=0.6,<0.7'` (install-voice.sh does it).
wake = [
    "openwakeword>=0.6,<0.7; python_version < '3.12'",
    "onnxruntime>=1.16", "numpy>=1.24", "scipy>=1.3", "scikit-learn>=1", "tqdm>=4", "requests>=2",
]
all = ["homeos-voice[audio,stt,tts,wake]"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
homeos-voice = "homeos_voice.__main__:main"

[tool.setuptools]
packages = ["homeos_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
