# Generate the Xcode project with: brew install xcodegen && xcodegen
name: HomeOS
options:
  bundleIdPrefix: com.homeos
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  HomeOS:
    type: application
    platform: iOS
    sources: [HomeOS]
    dependencies:
      - package: Supabase
    info:
      path: HomeOS/Info.plist
      properties:
        CFBundleDisplayName: Ohana
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Pick photos and videos to show on your family display, and your profile photo.
        NSCameraUsageDescription: Scan the pairing code on your family display.
        NSMicrophoneUsageDescription: Talk to the Ohana assistant instead of typing.
        NSSpeechRecognitionUsageDescription: Turn what you say to the Ohana assistant into text.
        # homeos://invite/<CODE> (invite links) and homeos://auth-callback (email links).
        CFBundleURLTypes:
          - CFBundleURLName: com.homeos.app
            CFBundleURLSchemes: [homeos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homeos.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
# A shared scheme, so `xcodebuild -scheme HomeOS` works on a fresh checkout (CI).
schemes:
  HomeOS:
    build:
      targets:
        HomeOS: all
    run:
      config: Debug
    archive:
      config: Release
