# Checks everything except the iOS app (ios.yml builds that). Each job only
# runs when its part of the tree, or this workflow, changes. See
# docs/PLATFORM_SPEC.md §7.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
      display: ${{ steps.filter.outputs.display }}
      pi_install: ${{ steps.filter.outputs.pi_install }}
      admin: ${{ steps.filter.outputs.admin }}
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - ".github/workflows/ci.yml"
            backend:
              - *workflow
              - "backend/supabase/migrations/**"
              - "backend/supabase/seed.sql"
              - "backend/tests/**"
            functions:
              - *workflow
              - "backend/supabase/functions/**"
            display:
              - *workflow
              - "display/**"
            # The Debian container install is the slowest job. On pushes it
            # follows the installers and what they install from; app code
            # waits for a pull request into main (see the job).
            pi_install:
              - *workflow
              - "display/deploy/**"
              - "voice/deploy/**"
              - "display/CMakeLists.txt"
              - "voice/pyproject.toml"
            admin:
              - *workflow
              - "admin/**"
            voice:
              - *workflow
              - "voice/**"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16
      # run.sh starts its own throwaway cluster on a free port, as the runner user.
      - name: Run SQL tests
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: backend/tests/run.sh

  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: deno check backend/supabase/functions/*/index.ts
      - name: Unit tests
        working-directory: backend/supabase/functions
        run: deno test

  display:
    needs: changes
    if: needs.changes.outputs.display == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same Qt modules the QML imports and install-pi.sh installs.
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev qt6-qpa-plugins \
            qt6-shadertools-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qml6-module-qtquick-shapes qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtmultimedia \
            qml6-module-qtquick-virtualkeyboard qt6-virtualkeyboard-plugin \
            qml6-module-qt-labs-folderlistmodel \
            qml6-module-qtquick-particles qml6-module-qtquick-localstorage libqt6sql6-sqlite \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            ffmpeg
      - name: Build
        run: |
          cmake -S display -B build/display -DCMAKE_BUILD_TYPE=Release
          cmake --build build/display -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build/display --output-on-failure
      - name: Smoke run (--demo, 5 s)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/display/homeos-display --demo > display.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0; wait "$pid" || status=$?
            echo "homeos-display exited early (status $status)"
            cat display.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
          cat display.log

  # The real Pi installer on Debian Trixie, the base of Raspberry Pi OS (x86-64
  # here; the Pi is arm64). Catches package names that only exist on Ubuntu,
  # Qt 6.8 build breaks (the display job builds with Ubuntu's Qt 6.4), voice
  # wheels missing for Python 3.13, and installer bugs before they reach a
  # device. It runs when the installers or voice/pyproject.toml change, and
  # on every pull request into main that touches display/ or voice/, so app
  # code still meets Qt 6.8 before it merges. Plain pushes of app code skip it.
  pi-install:
    needs: changes
    if: >-
      needs.changes.outputs.pi_install == 'true' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
      (needs.changes.outputs.display == 'true' || needs.changes.outputs.voice == 'true'))
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Prepare a Pi-like system (sudo user, no systemd)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates git curl
          useradd -m -s /bin/bash pi
          echo 'pi ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/pi
      - uses: actions/checkout@v4
      - name: Kiosk is enabled on install and owns tty1
        run: bash display/tests/kiosk_boot_test.sh
      - name: Stub systemctl
        run: install -m 755 display/deploy/pi-sim/systemctl-stub /usr/local/bin/systemctl
      - name: install-pi.sh --with-voice
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/pi/homeOS
          chown -R pi:pi /home/pi/homeOS
          sudo -u pi -H bash -c 'cd ~/homeOS && ./display/deploy/install-pi.sh --with-voice'
      - name: Smoke run of the installed app (--demo, 5 s)
        run: |
          set -a; . /etc/homeos/display.env; set +a
          export QT_QPA_PLATFORM=offscreen
          sudo -E -u pi /usr/local/bin/homeos-display --demo --no-keyboard > display.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "homeos-display exited early"; cat display.log; exit 1
          fi
          kill "$pid"; wait "$pid" || true
          cat display.log
      - name: Voice service imports and models
        run: |
          /opt/homeos-voice/bin/python -c "import sounddevice, webrtcvad, faster_whisper, piper, openwakeword, onnxruntime; print('voice imports ok')"
          ls -la /home/pi/.local/share/homeos-voice || true
      - name: Preview mode (virtual screen in a browser)
        run: |
          sudo -u pi -H bash -c 'cd ~/homeOS && ./display/deploy/preview.sh on'
          sudo -u pi -H setsid /usr/local/bin/homeos-preview > preview.log 2>&1 &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html || { cat preview.log; exit 1; }
          # Grab the screen through VNC, the same path a browser takes.
          sleep 5
          python3 -m venv /tmp/vnc && /tmp/vnc/bin/pip install -q vncdotool
          /tmp/vnc/bin/vncdo -s 127.0.0.1::5900 capture preview.png
          cat preview.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-preview
          path: preview.png
          if-no-files-found: ignore

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  voice:
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice/pyproject.toml
      - run: pip install -e 'voice[dev]'
      - run: pytest voice
