<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F6E9E1; }
  .stage { position: relative; width: 1024px; height: 1024px; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .b1 { width: 760px; height: 760px; left: -180px; top: -200px; background: #F08A6A; }
  .b2 { width: 720px; height: 720px; right: -220px; top: -120px; background: #F6C063; }
  .b3 { width: 820px; height: 820px; left: -120px; bottom: -300px; background: #7FA6F5; }
  .b4 { width: 620px; height: 620px; right: -160px; bottom: -180px; background: #B79AF0; }
  .b5 { width: 420px; height: 420px; left: 300px; top: 300px; background: #FBE3D6; filter: blur(140px); }
  .grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .ring { position: absolute; border-radius: 50%;
          border: 5px solid rgba(255,255,255,.62);
          background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.30), rgba(255,255,255,.08) 60%, rgba(255,255,255,.02));
          box-shadow: inset 0 0 60px rgba(255,255,255,.25), 0 30px 80px rgba(90,60,120,.10); }
  .r1 { width: 640px; height: 640px; left: 92px; top: 150px; }
  .r2 { width: 470px; height: 470px; left: 420px; top: 420px; border-color: rgba(255,255,255,.48); }
  .mark { position: absolute; left: 0; top: 0; width: 1024px; height: 1024px; }
</style></head><body><div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="blob b4"></div><div class="blob b5"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <svg class="mark" viewBox="0 0 1024 1024">
    <defs>
      <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A3C78" flood-opacity=".22"/>
      </filter>
    </defs>
    <!-- House: a soft-cornered roof and body, with a rounded door. -->
    <g filter="url(#s)" fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 492 L512 322 L724 492"/>
      <path d="M356 452 L356 690 Q356 716 382 716 L642 716 Q668 716 668 690 L668 452"/>
    </g>
    <path filter="url(#s)" d="M466 716 L466 604 Q466 566 512 566 Q558 566 558 604 L558 716 Z" fill="#FFFFFF"/>
  </svg>
  <div class="grain"></div>
</div></body></html>
